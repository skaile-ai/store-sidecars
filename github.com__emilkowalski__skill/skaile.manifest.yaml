publisher: emilkowalski
assets:
  - kind: skill
    name: animate
    root: skills/animate
    files:
      - SKILL.md
    version: 0.1.0
    description: Build an animation from scratch, making the decisions in the order that determines whether it feels right —
      should it animate at all, what purpose, which tool, which properties, which curve and duration, how it interrupts,
      how it exits. Writes the implementation. Use when asked to animate something, add motion, make a component feel
      alive, or build a transition. For critiquing existing motion use review-animations; for auditing a whole codebase
      use improve-animations.
  - kind: skill
    name: animate-expo
    root: skills/animate-expo
    files:
      - SKILL.md
    version: 0.1.0
    description: Build animations in React Native and Expo, making the decisions in the order that determines whether they
      feel right — should it animate, which thread it runs on, which properties, spring or timing, how the gesture hands
      off, how it degrades. Writes the implementation with Reanimated, Gesture Handler, Expo Router and expo-haptics.
      Use when animating anything in an Expo app, adding gestures, sheets, screen transitions, press feedback or
      haptics, or fixing motion that stutters on device. For web animation use `animate`.
  - kind: skill
    name: animation-performance
    root: skills/animation-performance
    files:
      - SKILL.md
    version: 0.1.0
    description: Keep web animations inside the frame budget — animate composite-only properties, keep motion off the main
      thread when the page is busy, and find the cause when an animation drops frames. Covers the layout/paint/composite
      pipeline, cheaper property swaps, CSS vs WAAPI vs requestAnimationFrame, Motion's hardware-accelerated path, React
      re-rendering per frame, inherited CSS variable recalculation, blur cost, and when `will-change` actually helps.
      Use when an animation is janky, choppy, stutters, or drops frames; when choosing which property to animate; when
      deciding between CSS and JS animation on performance grounds; or when reaching for `will-change` or GPU layers.
      For choosing easing, duration, or whether to animate at all use animate; for reviewing motion as a whole use
      review-animations.
  - kind: skill
    name: animation-vocabulary
    root: skills/animation-vocabulary
    files:
      - SKILL.md
    version: 0.1.0
    description: Reverse-lookup glossary that turns a vague description of a web animation or motion effect into its exact
      term ("the bouncy thing when a popover opens" → Pop in; "the iOS rubber-band scroll" → Rubber-banding). Use when
      the user asks "what's it called when…", or describes a motion effect without knowing its name and wants the right
      word to prompt an AI or designer with. For naming an effect, not designing or building one.
  - kind: skill
    name: apple-design
    root: skills/apple-design
    files:
      - SKILL.md
    version: 0.1.0
    description: Apple's approach to interface design and fluid, physical motion, translated for the web. Use when building
      or reviewing gesture-driven UI, spring animations, drag/swipe/sheet interactions, momentum and interruptible
      transitions, translucent materials and depth, typography (optical sizing, tracking, leading), reduced-motion, or
      the design foundations (feedback, spatial consistency, restraint) behind Apple-style interfaces.
  - kind: skill
    name: ask-sonner
    root: skills/ask-sonner
    files:
      - SKILL.md
    version: 0.1.0
    description: Guide to Sonner, the React toast library — install and wire up the Toaster, pick the right toast() call,
      promise and loading toasts, updating, dismissing and persisting toasts, styling, theming and icons, positioning
      and multiple toasters. Use when working with Sonner or troubleshooting it — toasts that don't appear, appear
      twice, lose their styles, ignore Tailwind classes, sit behind a modal, or don't follow dark mode.
  - kind: skill
    name: break-ui
    root: skills/break-ui
    files:
      - SKILL.md
    version: 0.1.0
    description: Try to break a piece of UI by feeding it worst-case data — long names, unbreakable emails, one-letter
      names, missing fields, huge counts, zero items, long labels, non-Latin text, emoji, extreme numbers — then render
      it behind a "Demo data / Worst case" toggle and report everything that broke, with the fix for each. Use when the
      user asks to stress-test, break, or find edge cases in a component or screen, or to "try the worst case". For
      visual design critique use emil-design-eng; for motion use review-animations.
  - kind: skill
    name: choreograph
    root: skills/choreograph
    files:
      - SKILL.md
    version: 0.1.0
    description: Coordinate several elements that animate together — decide what moves, in what order, how much they
      overlap, and what stays still — so a group reads as one intentional motion instead of a pile of separate
      animations. Use when building or fixing a staggered list, a hero entrance, a view swap inside a container, a
      multi-step flow, an element leaving while its siblings close the gap, a morph between rich states, or any
      interaction with several moving parts (icon + background + lines, panel + content, items flying into a target).
      Triggers on — stagger, staggerChildren, delayChildren, animation-delay, sequence, sequencing, orchestration,
      choreography, cascade, wave, timeline, "one after another", "at the same time", crossfade, popLayout, mode="wait",
      AnimatePresence mode, hero entrance, list entrance, multi-step, step transition, morph, useAnimate, Promise.all
      animations, "feels mechanical", "feels robotic", "too much going on", "feels slow to open".
  - kind: skill
    name: emil-design-eng
    root: skills/emil-design-eng
    files:
      - SKILL.md
    version: 0.1.0
    description: This skill encodes Emil Kowalski's philosophy on UI polish, component design, animation decisions, and the
      invisible details that make software feel great.
  - kind: skill
    name: find-animation-opportunities
    root: skills/find-animation-opportunities
    files:
      - SKILL.md
    version: 0.1.0
    description: Search a codebase or UI for places that don't animate but should, and reject everything that shouldn't.
      Read-only; it proposes motion with exact values, it does not implement it. Use when the user asks "what could be
      animated here?" or wants to "make this feel more alive". For fixing existing animations, use improve-animations or
      review-animations instead.
  - kind: skill
    name: improve-animations
    root: skills/improve-animations
    files:
      - SKILL.md
    version: 0.1.0
    description: Survey a codebase's animation and motion code as a senior motion advisor, then produce a prioritized audit
      and self-contained implementation plans for other agents (or cheaper models) to execute. Read-only on source code
      — it plans improvements, it does not apply them. Use when the user asks to "improve the animations", "audit the
      motion", "make this app feel better", or wants a roadmap of animation fixes rather than a review of a single diff.
  - kind: skill
    name: mobile-native
    root: skills/mobile-native
    files:
      - SKILL.md
    version: 0.1.0
    description: Make a web app feel native on a phone — the small CSS and meta-tag fixes that separate "a website in a
      browser" from something that feels installed. Covers sticky hover states, tap highlight flashes, the 100vh bug,
      inputs that zoom the page, laggy taps, pull-to-refresh hijacking scroll, content under the notch, long-press
      selecting button text, carousels that scroll the wrong way, mismatched status bars, and the rule that you test on
      real hardware. Use when a web app is being built for or reviewed on mobile, when something "works in Chrome but
      feels wrong on my phone", when building a PWA, a bottom sheet, a carousel, a full-screen layout, or any touch
      interaction. For motion itself use animate; for React Native use animate-expo.
  - kind: skill
    name: pick-ui-library
    root: skills/pick-ui-library
    files:
      - SKILL.md
    version: 0.1.0
    description: Pick the right library for a given frontend task from a curated, opinionated list — numbers, OTP inputs,
      charts, command menus, virtualization, drag and drop, toasts, state, styling, and more. Only runs when explicitly
      invoked; it does not trigger on its own.
  - kind: skill
    name: prototype
    root: skills/prototype
    files:
      - SKILL.md
    version: 0.1.0
    description: Build multiple genuinely different versions of a UI piece you describe, rendered behind a visual picker so
      you can flip through them live and promote the one that feels right. Only runs when explicitly invoked; it does
      not trigger on its own.
  - kind: skill
    name: remove-animations
    root: skills/remove-animations
    files:
      - SKILL.md
    version: 0.1.0
    description: Find the animations an interface doesn't need and remove them — motion on keyboard actions, high-frequency
      surfaces, functional data, and decoration with no purpose — then clean up what they leave behind. Edits code, but
      only to subtract; it never adds or retunes motion. Use when the user says the app "feels slow", "has too much
      animation", "feels over-animated", wants to "tone down the motion", or asks what animations to remove. For finding
      places that should animate, use find-animation-opportunities; for fixing animations that should stay, use
      improve-animations or review-animations.
  - kind: skill
    name: review-animations
    root: skills/review-animations
    files:
      - SKILL.md
    version: 0.1.0
    description: Reviews animation and motion code against a high craft bar derived from Emil Kowalski's design engineering
      philosophy. Default to flagging; approval is earned.
  - kind: skill
    name: write-swift
    root: skills/write-swift
    files:
      - SKILL.md
    version: 0.1.0
    description: How to write modern Swift well — modeling with value types, Swift 6 data-race safety and approachable
      concurrency (@concurrent, main-actor-by-default, actors, task groups), protocols and generics (some vs any), API
      design, performance and ARC, Swift Testing, macros, and the modern language features agents don't know about yet.
      Use when writing, reviewing, or migrating Swift, or when a concurrency error, a hang, a data race, a retain cycle,
      or a performance problem needs fixing.
